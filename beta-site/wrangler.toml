# Static beta page for inference.flisk.si while the hosted API is not public.
# Deploy by hand: cd beta-site && bunx wrangler@4 deploy
name = "inference-beta"
main = "worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "inference.flisk.si/*"
zone_name = "flisk.si"
