# inference.flisk.si on Cloudflare: the portal as a Worker, users and keys in D1, the model on Workers AI.
# Deploy by hand from this folder: bunx wrangler@4 deploy. Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, SESSION_SECRET.
# Optional overflow on OpenAI when the free allowance is used up: secret OPENAI_API_KEY (bunx wrangler@4 secret put OPENAI_API_KEY),
# vars OPENAI_MODEL (default gpt-4o-mini) and OPENAI_DAILY_LIMIT (extra requests a day, default 100). Without the secret nothing changes.
name = "flisk-inference"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_URL = "https://inference.flisk.si"
PORTAL_NAME = "Flisk Inference"
MODEL = "@cf/qwen/qwen2.5-coder-32b-instruct"
PUBLIC_MODEL = "flisk-wolf"
# No Flisk config rules, for general chat (chat.flisk.si, bot.flisk.si). Shares the daily limits.
CHAT_MODEL = "flisk-wolf-chat"
# Chat runs on Qwen3.8 27B at reasoning effort low (rates: src/worker.ts). The old qwen3-30b-a3b-fp8 retires on 20 Nov 2026.
# Remove this line to put chat back on MODEL.
CHAT_BASE_MODEL = "@cf/qwen/qwen3.8-27b"
# Flisk Wolf Large: Inkling 2 Small (Thinking Machines, 594B MoE) on Workers AI. Needs the Workers Paid plan; remove LARGE_BASE_MODEL to turn it off.
LARGE_MODEL = "flisk-wolf-large"
LARGE_BASE_MODEL = "@cf/thinkingmachines/inkling-2-small"
# Anthropic Messages API (POST /v1/messages, ANTHROPIC_BASE_URL=https://inference.flisk.si for Claude Code): a Workers AI model that reads
# images and calls tools, whatever model name the caller sends. Its own limit per key a day; not part of the shared totals below.
# Remove AGENT_BASE_MODEL to turn it off.
AGENT_MODEL = "flisk-wolf-agent"
AGENT_BASE_MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"
AGENT_DAILY_LIMIT = "2000"
# When Workers AI is out of its free allowance the same call runs on OpenRouter (free model with images + tools). Secret OPENROUTER_API_KEY
# (bunx wrangler@4 secret put OPENROUTER_API_KEY); without it nothing changes. Free keys get a small daily request count from OpenRouter.
AGENT_FALLBACK_MODEL = "google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free,nvidia/nemotron-3.5-super-vl:free,inclusionai/ling-3.2-flash:free,particle-ai/particle-1:free"
# Shared by every key: keeps the beta inside the Workers AI free daily allowance.
DAILY_LIMIT = "100"
# Shown when the daily limit is used up and under the limits meter in the console.
SPONSOR_URL = "https://github.com/sponsors/flisk-sh"
# Workers AI neurons a day, all keys. A chat call with a 2,000-token prompt costs about 140 on CHAT_BASE_MODEL at low
# effort (about 190 at medium; a website reply about 650); a short flisk-wolf call about 80, a 64 KB prompt up to ~1,100. The account's free
# allowance is 10,000 a day, shared with gardener.flisk.si (~2,000) and the docs Ask on Helpdock (~2,800); calls fail past it.
DAILY_NEURONS = "5500"

# Problems go to traces.flisk.si (flisk-sh/traces). Secret TRACE_KEY is this app's key there.
[[services]]
binding = "TRACES"
service = "flisk-traces"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "flisk-inference"
database_id = "f72dd429-fe8d-459c-ae1e-8ab1793ed315"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[rules]]
type = "Text"
globs = ["**/Modelfile"]
fallthrough = false

[[routes]]
pattern = "inference.flisk.si/*"
zone_name = "flisk.si"
