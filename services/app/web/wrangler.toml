# inference.flisk.si on Cloudflare: the portal as a Worker, users and keys in D1, the model on Workers AI.
# Deploy by hand from this folder: bunx wrangler@4 deploy. Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, SESSION_SECRET.
name = "flisk-inference"
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_URL = "https://inference.flisk.si"
PORTAL_NAME = "Flisk Inference"
MODEL = "@cf/qwen/qwen2.5-coder-32b-instruct"
PUBLIC_MODEL = "flisk-wolf"
# Shared by every key: keeps the beta inside the Workers AI free daily allowance.
DAILY_LIMIT = "100"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "flisk-inference"
database_id = "f72dd429-fe8d-459c-ae1e-8ab1793ed315"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[rules]]
type = "Text"
globs = ["**/Modelfile"]
fallthrough = false

[[routes]]
pattern = "inference.flisk.si/*"
zone_name = "flisk.si"
